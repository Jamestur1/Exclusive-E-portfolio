<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James Turner</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://kit.fontawesome.com/b4b84a6091.js" crossorigin="anonymous"></script> 
</head>
<body>
    <section id="landing-page">
        <nav>
           <figure>
            <img id="personal__logo" src="./assets/logo.svg" alt="">
           </figure> 
           <ul class="nav__link--list">
            <li class="nav__link">
               <a href="#" class="
               nav__link--anchor
               link__hover-effect
               link__hover-effect__black
               ">About</a> 
            </li>
            <li class="nav__link">
               <a href="#" class="
               nav__link--anchor
               link__hover-effect
               link__hover-effect__black
               ">Projects</a> 
            </li>
            <li class="nav__link">
               <a href="#" class="
               nav__link--anchor
               link__hover-effect
               link__hover-effect__black
               ">Contact</a> 
            </li>
            <li class="nav__link click">
               <a href="#" class="
               nav__link--anchor
               link__hover-effect
               link__hover-effect__black
               "><i class="fa-solid fa-circle-half-stroke"></i></a> 
            </li>
           </ul>
        </nav>
        <header class="header">
            <div class="header__content">
               <h1 class="title">Hey</h1>
               <h1 class="title orange">I'm James.</h1>
               <p class="header--para">I'm a passionate <b class="orange">frontend software engineer</b> and web developer. 
                I love creating beautiful, functional, and user-friendly websites and applications.
                <br>Here's a bit more <b class="orange">about me</b>.
               </p>
               <div class="social__list">
                <a href="https://github.com/james-turner" target="_blank" class="social__link click">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a href="https://x.com/james_turner" target="_blank" class="social__link click">
                    <i class="fa-brands fa-x-twitter"></i>
                </a>
                <a href="https://linkedin.com/in/james_turner" target="_blank" class="social__link click">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
               </div>
            </div>
        </header>
        <button class="mail__btn click">
           <i class="fa-solid fa-envelope"></i>
        </button>
        <a href="#projects" class="scroll">
            <div class="scroll__icon click"></div>
        </a>
    </section>

</html>
